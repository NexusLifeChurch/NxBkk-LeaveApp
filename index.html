<!DOCTYPE html>
<html lang="th" data-theme="cupcake">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HR-BKK Leave App</title>
    
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.10.2/dist/full.min.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Prompt', sans-serif; background-color: #f3f4f6; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .app-container { max-width: 480px; margin: 0 auto; min-height: 100vh; background-color: #fafafa; position: relative; overflow-x: hidden; }
        .modal-backdrop-soft { background-color: rgba(15, 23, 42, 0.4); backdrop-filter: blur(4px); }
        
        div:where(.swal2-container) div:where(.swal2-popup) { border-radius: 2rem !important; padding: 1.5rem 1rem 2rem 1rem !important; box-shadow: 0 10px 40px rgba(0,0,0,0.1) !important; }
        div:where(.swal2-container) h2:where(.swal2-title) { font-family: 'Prompt', sans-serif !important; font-size: 1.8rem !important; font-weight: 800 !important; color: #1E293B !important; }
        div:where(.swal2-container) div:where(.swal2-html-container) { font-family: 'Prompt', sans-serif !important; font-size: 1.15rem !important; font-weight: 500 !important; color: #475569 !important; margin-top: 1rem !important; line-height: 1.6 !important; }
        div:where(.swal2-container) button:where(.swal2-styled) { font-family: 'Prompt', sans-serif !important; border-radius: 1rem !important; font-size: 1.1rem !important; font-weight: 700 !important; padding: 0.75rem 2rem !important; }
        div:where(.swal2-container) textarea:where(.swal2-textarea) { font-family: 'Prompt', sans-serif !important; border-radius: 1rem !important; font-size: 1.1rem !important; padding: 1rem !important; border: 1px solid #CBD5E1 !important; background-color: #F8FAFC !important; }
    </style>
</head>
<body class="bg-base-200 min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const API_URL = "https://script.google.com/macros/s/AKfycbzmnO2wTEFffmACGIxHKCSzFmf4dbfmsIJrLBJBvK5fLDIfalwF7Va9NHCkvLhFbHUwsg/exec";
        const LIFF_ID = "2008647384-4VFgDXrP"; 

        function App() {
            const [currentPage, setCurrentPage] = React.useState('loading');
            
            const [emailInput, setEmailInput] = React.useState('');
            const [otpInput, setOtpInput] = React.useState('');
            const [isOtpMode, setIsOtpMode] = React.useState(false);
            
            const [isLoading, setIsLoading] = React.useState(false);
            const [userProfile, setUserProfile] = React.useState(null);
            const [lineProfile, setLineProfile] = React.useState(null);
            
            const [leaveTypes, setLeaveTypes] = React.useState([]);
            const [statusCodes, setStatusCodes] = React.useState({});
            const [requests, setRequests] = React.useState([]);
            const [departments, setDepartments] = React.useState([]);
            const [selectedDept, setSelectedDept] = React.useState('all');
            const [sortBy, setSortBy] = React.useState('reqId_desc'); 
            const [viewMode, setViewMode] = React.useState('board');

            const [formData, setFormData] = React.useState({ leaveType: '', startDate: '', endDate: '', reason: '' });
            const [startDayType, setStartDayType] = React.useState('full');
            const [endDayType, setEndDayType] = React.useState('full');

            const [selectedUserQuota, setSelectedUserQuota] = React.useState(null);
            const [isModalOpen, setIsModalOpen] = React.useState(false);

            React.useEffect(() => {
                const initLiff = async () => {
                    try {
                        await liff.init({ liffId: LIFF_ID });
                        if (liff.isLoggedIn()) {
                            const profile = await liff.getProfile();
                            setLineProfile({ uid: profile.userId, pictureUrl: profile.pictureUrl });
                            
                            const response = await fetch(API_URL, {
                                method: 'POST',
                                body: JSON.stringify({ action: 'loginWithLine', lineUid: profile.userId, pictureUrl: profile.pictureUrl })
                            });
                            const result = await response.json();
                            
                            if (result.success) {
                                setUserProfile(result.profile);
                                fetchSettings();
                                setCurrentPage('dashboard');
                            } else {
                                setCurrentPage('login');
                            }
                        } else {
                            liff.login();
                        }
                    } catch (err) {
                        setCurrentPage('login');
                    }
                };
                if (LIFF_ID) initLiff();
            }, []);

            const handleRequestOTP = async (e) => {
                e.preventDefault();
                setIsLoading(true);
                try {
                    const response = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'requestOTP', email: emailInput }) });
                    const result = await response.json();
                    if(result.success) {
                        setIsOtpMode(true);
                    } else {
                        Swal.fire({ title: 'HR-BKK', text: result.message || "ไม่พบอีเมลพนักงานนี้ในระบบ", icon: 'error', confirmButtonColor: '#3B82F6' });
                    }
                } catch (error) { 
                    Swal.fire({ title: 'HR-BKK', text: "เกิดข้อผิดพลาดในการเชื่อมต่อระบบ", icon: 'error', confirmButtonColor: '#3B82F6' }); 
                }
                setIsLoading(false);
            };

            const handleVerifyOTP = async (e) => {
                e.preventDefault();
                setIsLoading(true);
                try {
                    const payload = { action: 'verifyOTP', email: emailInput, otp: otpInput, lineUid: lineProfile?.uid || "", pictureUrl: lineProfile?.pictureUrl || "" };
                    const response = await fetch(API_URL, { method: 'POST', body: JSON.stringify(payload) });
                    const result = await response.json();
                    if(result.success) {
                        setUserProfile(result.profile);
                        fetchSettings(); 
                        setCurrentPage('dashboard');
                        setIsOtpMode(false);
                        setOtpInput('');
                    } else {
                        Swal.fire({ title: 'HR-BKK', text: result.message || "รหัส OTP ไม่ถูกต้อง", icon: 'error', confirmButtonColor: '#3B82F6' });
                    }
                } catch (error) { 
                    Swal.fire({ title: 'HR-BKK', text: "เกิดข้อผิดพลาดในการเชื่อมต่อระบบ", icon: 'error', confirmButtonColor: '#3B82F6' });
                }
                setIsLoading(false);
            };

            const fetchSettings = async () => {
                try {
                    const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'getSettings' }) });
                    const result = await res.json();
                    if(result.success) { setLeaveTypes(result.data.leaveTypes); setStatusCodes(result.data.statusCodes || {}); }
                } catch (error) {}
            };

            const fetchRequests = async () => {
                setIsLoading(true);
                try {
                    const dept = userProfile.role === 'Manager' ? userProfile.department : '';
                    const response = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'getLeaveRequests', email: userProfile.empEmail, role: userProfile.role, department: dept }) });
                    const result = await response.json();
                    if(result.success) {
                        setRequests(result.data);
                        if (userProfile.role === 'Admin' || userProfile.role === 'HR') setDepartments([...new Set(result.data.map(r => r.department))].filter(Boolean));
                    }
                } catch (error) {}
                setIsLoading(false);
            };

            const handleLeaveAction = async (req, actionType) => {
                let comment = "";
                let confirmMsg = "";
                let isCancelAction = actionType.includes('cancel');

                if (actionType === 'approve_to_hr') {
                    confirmMsg = `ยืนยันอนุมัติคำขอลา<br/><b class="text-blue-600 text-2xl">${req.empName}</b><br/>จำนวน <b class="text-slate-800">${req.totalDays}</b> วัน ใช่หรือไม่?`;
                } else if (actionType === 'acknowledge_hr') {
                    confirmMsg = `ยืนยันรับทราบและตัดวันลา<br/><b class="text-green-600 text-2xl">${req.empName}</b><br/>จำนวน <b class="text-slate-800">${req.totalDays}</b> วัน ใช่หรือไม่?`;
                } else if (isCancelAction) {
                    confirmMsg = actionType === 'cancel_admin_return' 
                        ? `ยืนยัน <b>ยกเลิกและคืนสิทธิ</b><br/>ให้ ${req.empName}?` 
                        : `ยืนยัน <b>ปฏิเสธคำขอลา</b> ของ<br/>${req.empName}?`;
                }

                let swalResult;
                if (isCancelAction) {
                    swalResult = await Swal.fire({
                        title: 'HR-BKK',
                        html: confirmMsg,
                        icon: 'warning',
                        input: 'textarea',
                        inputPlaceholder: 'ระบุเหตุผลที่นี่ (จำเป็น)...',
                        showCancelButton: true,
                        confirmButtonColor: '#EF4444',
                        cancelButtonColor: '#94A3B8',
                        confirmButtonText: 'ยืนยันปฏิเสธ',
                        cancelButtonText: 'ปิด',
                        inputValidator: (value) => {
                            if (!value) return 'กรุณาระบุเหตุผลในการยกเลิก/ปฏิเสธ'
                        }
                    });
                    if (!swalResult.isConfirmed) return;
                    comment = swalResult.value;
                } else {
                    swalResult = await Swal.fire({
                        title: 'HR-BKK',
                        html: confirmMsg,
                        icon: 'question',
                        showCancelButton: true,
                        confirmButtonColor: '#3B82F6',
                        cancelButtonColor: '#94A3B8',
                        confirmButtonText: 'ยืนยัน',
                        cancelButtonText: 'ยกเลิก'
                    });
                    if (!swalResult.isConfirmed) return;
                }

                setRequests(prev => prev.filter(r => r.reqId !== req.reqId)); 
                try {
                    const payload = { reqId: req.reqId, action: actionType, actionBy: userProfile.empEmail, comment: comment, empEmail: req.empEmail, managerEmail: req.managerEmail };
                    const response = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'processLeaveAction', payload: payload }) });
                    const result = await response.json();
                    if(result.success) {
                        if (result.targetEmail === userProfile.empEmail && result.updatedProfile) setUserProfile(result.updatedProfile);
                    } else {
                        Swal.fire({ title: 'HR-BKK', text: "ดำเนินการไม่สำเร็จ กรุณาลองใหม่", icon: 'error', confirmButtonColor: '#3B82F6' });
                        fetchRequests();
                    }
                } catch(e) { fetchRequests(); }
            };

            const handleSubmitLeave = async (e) => {
                e.preventDefault();
                setIsLoading(true);
                const start = new Date(formData.startDate);
                const end = new Date(formData.endDate);
                let diffDays = Math.ceil(Math.abs(end - start) / (1000 * 60 * 60 * 24)) + 1;
                
                if (formData.startDate === formData.endDate) {
                    if (startDayType === 'half' || endDayType === 'half') diffDays = 0.5;
                } else {
                    if (startDayType === 'half') diffDays -= 0.5;
                    if (endDayType === 'half') diffDays -= 0.5;
                }

                if (diffDays <= 0) { 
                    Swal.fire({ title: 'HR-BKK', text: 'ระบุวันที่ลาไม่ถูกต้อง', icon: 'warning', confirmButtonColor: '#3B82F6' });
                    setIsLoading(false); return; 
                }

                const payload = { empEmail: userProfile.empEmail, leaveType: formData.leaveType, startDate: formData.startDate, endDate: formData.endDate, totalDays: diffDays, reason: formData.reason };

                try {
                    const response = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'submitLeaveRequest', payload: payload }) });
                    const result = await response.json();
                    if(result.success) {
                        Swal.fire({ 
                            title: 'HR-BKK', 
                            text: 'ระบบได้รับคำขอของท่านเรียบร้อยแล้ว!', 
                            icon: 'success', 
                            confirmButtonColor: '#3B82F6' 
                        }).then(() => {
                            setFormData({ leaveType: '', startDate: '', endDate: '', reason: '' });
                            setCurrentPage('dashboard'); 
                        });
                    } else { 
                        Swal.fire({ title: 'HR-BKK', text: result.message, icon: 'error', confirmButtonColor: '#3B82F6' });
                    }
                } catch (error) { 
                    Swal.fire({ title: 'HR-BKK', text: 'ส่งข้อมูลไม่สำเร็จ กรุณาลองใหม่', icon: 'error', confirmButtonColor: '#3B82F6' });
                }
                setIsLoading(false);
            };

            const shortDate = (dateStr) => new Date(dateStr).toLocaleDateString('th-TH', {day: 'numeric', month: 'short', year: '2-digit'});

            const getLeaveStyle = (type) => {
                if(type.includes('กิจ')) return { bg: 'bg-[#FFF3E0]', border: 'border-[#FFE0B2]', text: 'text-[#E65100]', icon: '📝', badge: 'bg-[#FFE0B2] text-[#E65100]' };
                if(type.includes('ป่วย')) return { bg: 'bg-[#E3F2FD]', border: 'border-[#BBDEFB]', text: 'text-[#1565C0]', icon: '💊', badge: 'bg-[#BBDEFB] text-[#1565C0]' };
                if(type.includes('พักร้อน')) return { bg: 'bg-[#E8F5E9]', border: 'border-[#C8E6C9]', text: 'text-[#2E7D32]', icon: '🌴', badge: 'bg-[#C8E6C9] text-[#2E7D32]' };
                if(type.includes('นอกสถานที่')) return { bg: 'bg-[#F3E5F5]', border: 'border-[#E1BEE7]', text: 'text-[#6A1B9A]', icon: '🚗', badge: 'bg-[#E1BEE7] text-[#6A1B9A]' };
                return { bg: 'bg-[#F5F5F5]', border: 'border-[#E0E0E0]', text: 'text-[#424242]', icon: '📄', badge: 'bg-[#E0E0E0] text-[#424242]' };
            };

            const getStatusBadgeInfo = (code) => {
                if (code == 1) return { label: statusCodes[1] || '⏳ รอหัวหน้าอนุมัติ', cls: 'bg-amber-100 text-amber-800 border border-amber-200' };
                if (code == 2) return { label: statusCodes[2] || '🔄 รอ HR ตัดวันลา', cls: 'bg-blue-100 text-blue-800 border border-blue-200' };
                if (code == 3) return { label: statusCodes[3] || '✅ อนุมัติเสร็จสิ้น', cls: 'bg-emerald-100 text-emerald-800 border border-emerald-200' };
                if (code == 5) return { label: statusCodes[5] || '❌ ยกเลิก/ปฏิเสธ', cls: 'bg-rose-100 text-rose-800 border border-rose-200' };
                return { label: 'รอดำเนินการ', cls: 'bg-slate-100 text-slate-600' };
            };

            const Avatar = ({ url, name, sizeClass="w-10", onClick=null }) => (
                <div className={`avatar ${onClick ? 'cursor-pointer hover:opacity-80 transition' : ''}`} onClick={onClick}>
                    <div className={`${sizeClass} rounded-full ring ring-white ring-offset-white shadow-sm bg-base-200`}>
                        <img src={url || `https://ui-avatars.com/api/?name=${name}&background=random&color=fff&font-size=0.6&bold=true`} alt="Profile" />
                    </div>
                </div>
            );

            const QuotaModal = () => {
                if (!isModalOpen || !selectedUserQuota) return null;
                const req = selectedUserQuota;
                return (
                    <div className="fixed inset-0 z-50 flex items-center justify-center p-4 modal-backdrop-soft" onClick={() => setIsModalOpen(false)}>
                        <div className="bg-white w-full max-w-sm rounded-[2rem] p-6 shadow-2xl relative" onClick={e => e.stopPropagation()}>
                            <button onClick={() => setIsModalOpen(false)} className="btn btn-sm btn-circle btn-ghost absolute right-4 top-4 text-slate-400">✕</button>
                            
                            <div className="flex flex-col items-center mb-6 mt-2">
                                <Avatar url={req.pictureUrl} name={req.empName} sizeClass="w-20" />
                                <h3 className="font-bold text-xl text-slate-800 mt-3 text-center">{req.empName}</h3>
                                <p className="text-sm text-slate-500 font-medium">แผนก {req.department}</p>
                            </div>
                            
                            <div className="space-y-3">
                                <div className="bg-[#FFF3E0] p-4 rounded-2xl flex justify-between items-center border border-[#FFE0B2]">
                                    <div className="flex items-center gap-2">
                                        <span className="text-xl">📝</span>
                                        <div><p className="text-[10px] font-bold text-[#E65100]/60 leading-none">ลากิจ</p><p className="text-sm font-bold text-[#E65100]">สิทธิ {req.qPersonal || 0} (ใช้ {req.uPersonal || 0})</p></div>
                                    </div>
                                    <div className="text-2xl font-black text-[#E65100]">{req.rPersonal || 0}</div>
                                </div>
                                <div className="bg-[#E3F2FD] p-4 rounded-2xl flex justify-between items-center border border-[#BBDEFB]">
                                    <div className="flex items-center gap-2">
                                        <span className="text-xl">💊</span>
                                        <div><p className="text-[10px] font-bold text-[#1565C0]/60 leading-none">ลาป่วย</p><p className="text-sm font-bold text-[#1565C0]">สิทธิ {req.qSick || 0} (ใช้ {req.uSick || 0})</p></div>
                                    </div>
                                    <div className="text-2xl font-black text-[#1565C0]">{req.rSick || 0}</div>
                                </div>
                                <div className="bg-[#E8F5E9] p-4 rounded-2xl flex justify-between items-center border border-[#C8E6C9]">
                                    <div className="flex items-center gap-2">
                                        <span className="text-xl">🌴</span>
                                        <div><p className="text-[10px] font-bold text-[#2E7D32]/60 leading-none">พักร้อน</p><p className="text-sm font-bold text-[#2E7D32]">สิทธิ {req.qAnnual || 0} (ใช้ {req.uAnnual || 0})</p></div>
                                    </div>
                                    <div className="text-2xl font-black text-[#2E7D32]">{req.rAnnual || 0}</div>
                                </div>
                            </div>
                        </div>
                    </div>
                );
            };

            const LeaveCard = ({ req, isPersonalView = false }) => {
                const style = getLeaveStyle(req.leaveType);
                const statusInfo = getStatusBadgeInfo(req.statusCode);
                const openQuotaModal = () => { setSelectedUserQuota(req); setIsModalOpen(true); };

                return (
                    <div className={`card ${style.bg} ${style.border} shadow-sm mb-4 hover:shadow-md transition-all rounded-[1.25rem]`}>
                        <div className="card-body p-4">
                            <div className="flex justify-between items-center mb-3">
                                <div className="flex items-center gap-3 w-full">
                                    <div onClick={openQuotaModal} title="กดเพื่อดูสิทธิคงเหลือ"><Avatar url={req.pictureUrl} name={req.empName} sizeClass="w-10" onClick={openQuotaModal}/></div>
                                    <div className="flex flex-col flex-1 min-w-0">
                                        <div className="flex justify-between items-start w-full">
                                            <span className="font-bold text-base text-slate-800 truncate pr-2 leading-tight">{req.empName}</span>
                                            <span className="text-[10px] font-bold text-slate-400 tracking-wider">#{req.reqId.replace('2026-', '')}</span>
                                        </div>
                                        <div className="flex justify-between items-center mt-0.5">
                                            <span className="text-[11px] text-slate-500 font-medium">แผนก {req.department}</span>
                                            {isPersonalView && (
                                                <span className={`px-2 py-0.5 rounded-full text-[10px] font-bold ${statusInfo.cls}`}>{statusInfo.label}</span>
                                            )}
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div className="bg-white/60 p-3 rounded-xl border border-black/5 space-y-2">
                                <div className="flex justify-between items-center">
                                    <div className={`flex items-center gap-1.5 font-bold text-[13px] ${style.text}`}><span>{style.icon}</span> {req.leaveType}</div>
                                    <div className={`px-2 py-0.5 rounded text-[11px] font-bold ${style.badge}`}>{req.totalDays} วัน</div>
                                </div>
                                <div className="flex items-start gap-2"><span className="text-[13px] opacity-70">📅</span><span className="font-semibold text-slate-700 text-xs mt-0.5">{shortDate(req.startDate)} - {shortDate(req.endDate)}</span></div>
                                <div className="flex items-start gap-2"><span className="text-[13px] opacity-70">💬</span><span className="font-medium text-slate-600 text-xs mt-0.5">{req.reason}</span></div>
                            </div>
                            {req.actionReason && <div className="bg-red-50 text-red-600 p-2.5 rounded-xl mt-3 text-[11px] font-semibold border border-red-100 flex items-start gap-1"><span className="text-sm">⚠️</span><span>{req.actionReason}</span></div>}

                            {!isPersonalView && (
                                <div className="flex gap-2 mt-4 pt-3 border-t border-black/5">
                                    {userProfile.role === 'Manager' && req.statusCode == 1 && req.managerEmail?.toLowerCase() === userProfile.empEmail?.toLowerCase() && (
                                        <><button onClick={() => handleLeaveAction(req, 'cancel_by_manager')} className="flex-1 btn btn-sm min-h-0 h-9 bg-[#FFCDD2] hover:bg-[#EF9A9A] text-[#C62828] border-none font-bold text-xs">❌ ปฏิเสธ</button><button onClick={() => handleLeaveAction(req, 'approve_to_hr')} className="flex-[1.2] btn btn-sm min-h-0 h-9 bg-[#B3E5FC] hover:bg-[#81D4FA] text-[#0277BD] border-none font-bold text-xs">✅ อนุมัติ</button></>
                                    )}
                                    {(userProfile.role === 'HR' || userProfile.role === 'Admin') && (
                                        <>
                                            {req.statusCode == 1 && <><button onClick={() => handleLeaveAction(req, 'cancel_by_hr_sub')} className="flex-1 btn btn-sm min-h-0 h-9 bg-[#FFCDD2] hover:bg-[#EF9A9A] text-[#C62828] border-none font-bold text-xs">❌ ปฏิเสธ (แทน)</button><button onClick={() => handleLeaveAction(req, 'approve_to_hr')} className="flex-[1.2] btn btn-sm min-h-0 h-9 bg-[#B3E5FC] hover:bg-[#81D4FA] text-[#0277BD] border-none font-bold text-xs">✅ อนุมัติ (แทน)</button></>}
                                            {req.statusCode == 2 && <><button onClick={() => handleLeaveAction(req, 'cancel_by_hr')} className="flex-[0.8] btn btn-sm min-h-0 h-9 bg-[#FFCDD2] hover:bg-[#EF9A9A] text-[#C62828] border-none font-bold text-xs px-1">❌ ยกเลิก</button><button onClick={() => handleLeaveAction(req, 'acknowledge_hr')} className="flex-[1.2] btn btn-sm min-h-0 h-9 bg-[#C8E6C9] hover:bg-[#A5D6A7] text-[#2E7D32] border-none font-bold text-xs px-1 tracking-tight">✂️ ทราบ+ตัดวันลา</button></>}

                    <div className="space-y-3">
                        <button onClick={() => setCurrentPage('form')} className="card bg-white shadow-sm border border-slate-100 w-full hover:shadow-md transition-all active:scale-[0.98] rounded-[1.5rem]">
                            <div className="card-body p-4 flex-row items-center justify-between">
                                <div className="flex items-center gap-4">
                                    <div className="avatar placeholder"><div className="bg-blue-50 text-blue-500 rounded-xl w-12 h-12 text-xl shadow-inner">📝</div></div>
                                    <div className="text-left"><h4 className="font-bold text-slate-700 text-lg mb-0.5">เขียนใบคำขอลา</h4><p className="text-[11px] text-slate-400 font-medium">ยื่นแบบฟอร์มการลาใหม่</p></div>
                                </div>
                                <span className="text-slate-300 text-2xl font-light">›</span>
                            </div>
                        </button>

                        <button onClick={() => { fetchRequests(); setCurrentPage('my_requests'); }} className="card bg-white shadow-sm border border-slate-100 w-full hover:shadow-md transition-all active:scale-[0.98] rounded-[1.5rem]">
                            <div className="card-body p-4 flex-row items-center justify-between">
                                <div className="flex items-center gap-4">
                                    <div className="avatar placeholder"><div className="bg-emerald-50 text-emerald-500 rounded-xl w-12 h-12 text-xl shadow-inner">🔍</div></div>
                                    <div className="text-left"><h4 className="font-bold text-slate-700 text-lg mb-0.5">ตรวจสอบใบคำขอของฉัน</h4><p className="text-[11px] text-slate-400 font-medium">เช็คสถานะและประวัติการลาของตนเอง</p></div>
                                </div>
                                <span className="text-slate-300 text-2xl font-light">›</span>
                            </div>
                        </button>

                        {userProfile.role !== 'Employee' && (
                            <button onClick={() => { fetchRequests(); setCurrentPage('feed'); }} className="card bg-white shadow-sm border border-slate-100 w-full hover:shadow-md transition-all active:scale-[0.98] rounded-[1.5rem]">
                                <div className="card-body p-4 flex-row items-center justify-between">
                                    <div className="flex items-center gap-4">
                                        <div className="avatar placeholder"><div className="bg-orange-50 text-orange-500 rounded-xl w-12 h-12 text-xl shadow-inner">📋</div></div>
                                        <div className="text-left"><h4 className="font-bold text-slate-700 text-lg mb-0.5">Board จัดการใบลา</h4><p className="text-[11px] text-slate-400 font-medium">ตรวจสอบและอนุมัติรายการในสังกัด</p></div>
                                    </div>
                                    <span className="text-slate-300 text-2xl font-light">›</span>
                                </div>
                            </button>
                        )}
                    </div>
                    <div className="text-center mt-10 mb-6"><button onClick={() => { liff.logout(); setCurrentPage('login'); }} className="btn btn-ghost btn-sm text-slate-400 hover:text-red-500 tracking-wider text-[10px] font-bold">ออกจากระบบ (เปลี่ยนบัญชี LINE)</button></div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
